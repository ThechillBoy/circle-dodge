<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Circle Dodge Game</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="ui">
<div id="score">Score: 0</div>
<div id="level">Level: 1</div>
<div id="highscore">Best: 0</div>
</div>

<button id="soundBtn" onclick="toggleSound()" title="Toggle sound">&#128266;</button>

<div class="banner" id="banner"></div>

<canvas id="gameCanvas"></canvas>

<div class="overlay" id="start" style="display:flex">
<h1>CIRCLE DODGE</h1>
<p>Your cyan circle = you. Dodge red, pink &amp; orange ones!</p>
<p style="color:#fbbf24">Collect green (+1) &amp; gold (+5). Every 5 points = next level!</p>
<p style="color:#38bdf8">POWER-UPS: Shield (invincible) &amp; Slow-Mo. Chain pickups fast for combo bonus!</p>
<button onclick="startGame()">START GAME</button>
</div>

<div class="overlay" id="gameOver">
<h1>GAME OVER</h1>
<div class="final-score" id="finalScore">Score: 0</div>
<p id="newBest" style="display:none;color:#fbbf24;font-weight:bold;font-size:24px">NEW BEST!</p>
<p id="bestScore">Best: 0</p>
<button onclick="resetGame()">PLAY AGAIN</button>
</div>

<script src="script.js"></script>
</body>
</html>
